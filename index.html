.hero-image{

  filter:

  transform:

}

.hero-overlay{
  position:absolute;

  inset:0;

  z-index:1;

  background:

  linear-gradient(
    to bottom,
    rgba(0,0,0,.08) 0%,
    rgba(0,0,0,.03) 28%,
    rgba(0,0,0,.30) 66%,
